  <!-- Custom styles for blueprint dotted grid, transitions, and glow details -->
  <style>
    /* Blueprint Dotted Grid Background (Theme-Adaptive) */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(var(--dot-color, rgba(255, 255, 255, 0.015)) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
      transition: background-image 0.5s ease;
    }

    .dark body::before {
      --dot-color: rgba(255, 255, 255, 0.015);
    }
    
    html:not(.dark) body::before {
      --dot-color: rgba(9, 9, 11, 0.025);
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(var(--float-y, -10px)) rotate(var(--rotate-deg, 5deg)); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    
    .floating-icon-el {
      animation: float var(--float-dur, 4s) ease-in-out infinite;
      transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out, color 0.6s ease;
    }
    
    /* Scrollbar Styling for adaptive themes */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    html:not(.dark) ::-webkit-scrollbar-thumb {
      background: rgba(9, 9, 11, 0.1);
      border-radius: 4px;
    }
    html:not(.dark) ::-webkit-scrollbar-thumb:hover {
      background: rgba(9, 9, 11, 0.2);

    /* Transition for glowing radial layers */
    #top-gradient, #bottom-gradient {

    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

    function getAuraColor(tabName, isDark) {
      const colors = {
        saas: isDark ? "rgba(59, 130, 246, 0.18)" : "rgba(59, 130, 246, 0.12)",
        appdesign: isDark ? "rgba(139, 92, 246, 0.18)" : "rgba(139, 92, 246, 0.12)",

        landing: isDark ? "rgba(245, 158, 11, 0.12)" : "rgba(245, 158, 11, 0.08)",
        visualdesign: isDark ? "rgba(244, 63, 94, 0.18)" : "rgba(244, 63, 94, 0.12)",
        vibecode: isDark ? "rgba(6, 182, 212, 0.18)" : "rgba(6, 182, 212, 0.12)"
      };
      return colors[tabName];
    }

    // --- Helper: Update Background Icon Types, Colors and Aura ---
    function updateBackgroundIcons(tabName) {
      const style = tabStyles[tabName];
      const isDark = currentTheme === "dark";
      const auraColor = getAuraColor(tabName, isDark);

      // Transition glowing radial backdrops
      document.getElementById("top-gradient").style.background = `radial-gradient(circle at 50% -100px, ${auraColor} 0%, transparent 65%)`;
      document.getElementById("bottom-gradient").style.background = `radial-gradient(circle at 50% 110%, ${auraColor} 0%, transparent 65%)`;

      // Update SVG path and stroke color
      document.querySelectorAll(".floating-icon-el").forEach(el => {
        el.style.color = style.iconColor;
        const svg = el.querySelector(".float-svg");
        if (svg) svg.innerHTML = style.svgPath;
      });
    }

    // --- Theme Management Logic (Light/Dark Mode Toggle) ---
    function toggleTheme() {
      const targetTheme = currentTheme === "dark" ? "light" : "dark";
      setTheme(targetTheme);
      handleRouting(); // Redraw UI elements with correct theme styles
    }

    // --- Theme Management Logic (Light/Dark Mode Toggle) ---
    function setTheme(theme) {
      currentTheme = theme;
      const html = document.documentElement;
      const isLight = theme === "light";

      if (isLight) {
        html.classList.remove("dark");
      } else {
        html.classList.add("dark");
      }

      // Update the SVGs for both desktop and mobile theme toggles
      const svgContent = isLight ? `
        <svg class="w-5 h-5 text-zinc-700" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
      ` : `
        <svg class="w-5 h-5 text-zinc-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21M4.93 4.93l1.59 1.59m10.96 10.96l1.59 1.59M3 12h2.25m13.5 0H21m-2.23-7.07l-1.59 1.59m-10.96 10.96l-1.59 1.59M12 8.25a3.75 3.75 0 100 7.5 3.75 3.75 0 000-7.5z" />
        </svg>
      `;

      document.querySelectorAll(".theme-toggle-btn").forEach(btn => {
        btn.innerHTML = svgContent;
      });

      localStorage.setItem("theme", theme);
    }

    // --- Scroll Listener Logic ---
    function handleScroll() {
      const scrolled = window.scrollY > 80;
      const backToTop = document.getElementById("scroll-to-top");
      const bottomGrad = document.getElementById("bottom-gradient");

      // Bottom aura gradient visibility on scroll
      if (scrolled) {
        bottomGrad.classList.remove("opacity-0");
        bottomGrad.classList.add("opacity-100");
      } else {
        bottomGrad.classList.remove("opacity-100");
        bottomGrad.classList.add("opacity-0");
      }

      // Back-to-top button threshold
      if (window.scrollY > 200) {
        backToTop.classList.remove("opacity-0", "pointer-events-none", "translate-y-2");
        backToTop.classList.add("opacity-100", "translate-y-0");
      } else {
        backToTop.classList.remove("opacity-100", "translate-y-0");
        backToTop.classList.add("opacity-0", "pointer-events-none", "translate-y-2");
      }
    }

    // --- Router Navigation Handling ---
    function navigateTo(path) {
      window.location.hash = path;
      closeMobileMenu();
    }

    function handleRouting() {
      const hash = window.location.hash || "#/saas";
      const parts = hash.split("/");
      const category = parts[1] || "saas";
      const slug = parts[2] || "";

      switchTabState(category);

      if (category === "landing") {
        activeLandingSlug = slug || landingProjects[0].slug;
        renderLandingPagesView(activeLandingSlug);
      } else if (category === "saas") {
        renderProjectsList(saasProjects, "saas", slug);
      } else if (category === "appdesign") {
        renderProjectsList(appDesignProjects, "appdesign", slug);
      } else if (category === "visualdesign") {
        renderVisualDesignView();
      } else if (category === "dashboards") {
        renderDashboardsView(slug);
      } else if (category === "vibecode") {
        renderVibeCodeView();
      }

      updateBackgroundIcons(category);
    }

    // --- Dynamic Layout Helper: Format Project Description and Case Study Drawer ---
    function formatProjectContext(p) {
      const sections = p.context.split("<br><br>");
      const intro = sections[0] || "";
      
      // Formulate bullet highlights from the second section
      let bulletsHTML = "";
      if (sections[1]) {
        const points = sections[1]
          .replace(/<\/?[^>]+(>|$)/g, "") // strip html tags
          .split(/[.;] /)
          .map(pt => pt.trim())
          .filter(pt => pt.length > 3);
        
        if (points.length > 0) {
          bulletsHTML = `
            <div class="mt-4 mb-4">
              <p class="text-[10px] font-extrabold text-zinc-950 dark:text-white uppercase tracking-wider mb-2">Key Focus Areas</p>
              <ul class="space-y-1.5 text-xs sm:text-sm text-zinc-600 dark:text-zinc-400">
                ${points.map(pt => `
                  <li class="flex items-start gap-2">
                    <span class="text-emerald-500 font-bold shrink-0">✓</span>
                    <span>${pt.endsWith('.') ? pt : pt + '.'}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
          `;
        }
      }

      // Formulate expandable case study details from the remaining sections
      const rest = sections.slice(2).join("<br><br>");
      let drawerHTML = "";
      if (rest.trim().length > 0) {
        drawerHTML = `
          <div id="drawer-${p.id}" class="h-0 overflow-hidden transition-all duration-500 ease-in-out">
            <div class="pt-4 border-t border-zinc-100 dark:border-white/5 mt-4 text-xs sm:text-sm text-zinc-500 dark:text-zinc-400 leading-relaxed">
              ${rest}
            </div>
          </div>
          <button onclick="toggleCaseStudyDrawer(${p.id})" id="drawer-btn-${p.id}" class="mt-4 text-xs font-bold text-zinc-800 dark:text-zinc-300 hover:text-zinc-950 dark:hover:text-white flex items-center gap-1.5 group/btn cursor-pointer">
            <span>Read Case Study</span>
            <svg id="drawer-arrow-${p.id}" class="w-3.5 h-3.5 transition-transform duration-300" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
          </button>
        `;
      }

      return `
        <div class="text-zinc-700 dark:text-zinc-300 text-xs sm:text-sm leading-relaxed">
          <p>${intro}</p>
          ${bulletsHTML}
          ${drawerHTML}
        </div>
      `;
    }

    // Toggle Expand/Collapse Project Details Drawer
    function toggleCaseStudyDrawer(id) {
      const drawer = document.getElementById(`drawer-${id}`);
      const btn = document.getElementById(`drawer-btn-${id}`).querySelector("span");
      const arrow = document.getElementById(`drawer-arrow-${id}`);
      
      if (drawer.style.height === "auto" || drawer.classList.contains("expanded-drawer")) {
        drawer.style.height = "0px";
        drawer.classList.remove("expanded-drawer");
        btn.innerText = "Read Case Study";
        arrow.style.transform = "rotate(0deg)";
      } else {
        drawer.style.height = "auto";
        const height = drawer.scrollHeight + "px";
        drawer.style.height = "0px";
        
        setTimeout(() => {
          drawer.style.height = height;
          drawer.classList.add("expanded-drawer");
        }, 10);
        
        setTimeout(() => {
          if (drawer.classList.contains("expanded-drawer")) {
            drawer.style.height = "auto";
          }
        }, 500);

        btn.innerText = "Collapse Case Study";
        arrow.style.transform = "rotate(180deg)";
      }
    }

    // --- Lightbox Modal functions ---
    function openLightbox(src) {
      const modal = document.getElementById("lightbox-modal");
      const img = document.getElementById("lightbox-img");
      img.src = src;
      modal.classList.remove("opacity-0", "pointer-events-none");
      modal.classList.add("opacity-100");
      
      setTimeout(() => {
        img.classList.remove("scale-95");
        img.classList.add("scale-100");
      }, 50);

      document.addEventListener("keydown", handleLightboxEscape);
    }

    // --- Lightbox Modal functions ---
    function closeLightbox() {
      const modal = document.getElementById("lightbox-modal");
      const img = document.getElementById("lightbox-img");
      img.classList.remove("scale-100");
      img.classList.add("scale-95");
      modal.classList.remove("opacity-100");
      modal.classList.add("opacity-0", "pointer-events-none");
      
      document.removeEventListener("keydown", handleLightboxEscape);
    }

    function handleLightboxEscape(e) {
      if (e.key === "Escape") {
        closeLightbox();
      }
    }

    // --- Copy Email helper ---
    function copyEmailToClipboard(email) {
      navigator.clipboard.writeText(email).then(() => {
        const toast = document.getElementById("toast");
        const toastText = document.getElementById("toast-text");
        toastText.innerText = "Email address copied to clipboard!";
        
        toast.classList.remove("opacity-0", "pointer-events-none");
        toast.classList.add("opacity-100");
        
        setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0", "pointer-events-none");
        }, 2000);
      });
    }

            <p class="text-zinc-600 dark:text-zinc-300 text-sm sm:text-base leading-relaxed">
              I'm a designer first, with a deep foundation in HTML, CSS, and Canvas. That combination means I don't just generate code;
              <span class="text-zinc-950 dark:text-white font-semibold">I direct it.</span>
              I know exactly how an interface should feel, behave, and scale in a real product.
              <span class="text-zinc-950 dark:text-white font-semibold">Vibe coding didn't replace my craft. It amplified it.</span>
            </p>
          </div>

          <!-- Project Sites Grid with Tech Badges -->
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 2xl:grid-cols-4 gap-6">
            ${vibeCodeProjects.map((p) => `
              <a href="${p.url}" target="_blank" rel="noopener noreferrer" 
                 class="group bg-white/80 dark:bg-zinc-900/20 rounded-2xl border border-zinc-200/50 dark:border-white/5 shadow-lg dark:shadow-2xl hover:shadow-[0_15px_35px_rgba(0,0,0,0.06)] dark:hover:shadow-black hover:border-zinc-300 dark:hover:border-white/10 hover:bg-white dark:hover:bg-zinc-900/45 transition-all duration-500 hover:-translate-y-1.5 overflow-hidden flex flex-col font-sans">
                
                <div class="p-3 pb-0">
                  <div class="w-full aspect-[16/10] bg-zinc-100 dark:bg-zinc-900/60 overflow-hidden relative rounded-xl border border-zinc-200/50 dark:border-white/5">
                    <img src="${p.image}" alt="${p.name} screenshot" class="w-full h-full object-cover object-top group-hover:scale-[1.02] transition-transform duration-500" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600&auto=format&fit=crop&q=60';">
                    
                    <!-- Blur Hover overlay button -->
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/40 backdrop-blur-0 group-hover:backdrop-blur-[1px] transition-all duration-300 flex items-center justify-center">
                      <span class="opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition-all duration-300 bg-zinc-950 dark:bg-white text-white dark:text-zinc-950 text-xs font-bold px-4 py-2.5 rounded-xl flex items-center gap-2 shadow-2xl">
                        Visit Site
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2V8a2 2 0 0 1 2-2h6"/></svg>
                      </span>
                    </div>
                  </div>
                </div>

                <div class="px-5 py-4 flex flex-col justify-between flex-1 gap-3">
                  <div>
                    <p class="font-extrabold text-zinc-950 dark:text-white text-sm leading-tight group-hover:text-zinc-800 dark:group-hover:text-cyan-400 transition-colors">${p.name}</p>
                    <p class="text-zinc-400 text-xs mt-1 truncate max-w-[220px]">${p.url.replace(/^https?:\/\//, '').replace(/\/$/, '')}</p>
                  </div>
                  
                  <!-- Tech stack badges -->
                  <div class="flex flex-wrap gap-1.5 mt-2 mb-1 border-t border-zinc-100 dark:border-white/5 pt-3">
                    ${p.tags.map(tag => `
                      <span class="bg-zinc-100 dark:bg-white/5 border border-zinc-200/50 dark:border-white/5 text-[9px] text-zinc-500 dark:text-zinc-400 font-extrabold uppercase px-2 py-0.5 rounded-md">
                        ${tag}
                      </span>
                    `).join('')}
                  </div>
                </div>

              </a>
            `).join('')}
          </div>
        `;

        container.classList.remove("opacity-0", "scale-[0.98]");
        const headerEl = document.querySelector(".relative.z-20");
        if (headerEl) headerEl.scrollIntoView({ behavior: "instant", block: "start" });

      }, 150);
    }

    // --- Interactive Feature: Carousel controls ---
    function prevCarouselImg(id, images) {
      const total = images.length;
      carouselIndexes[id] = (carouselIndexes[id] - 1 + total) % total;
      updateCarouselUI(id, images);
    }

    // --- Interactive Feature: Carousel controls ---
    function nextCarouselImg(id, images) {
      const total = images.length;
      carouselIndexes[id] = (carouselIndexes[id] + 1) % total;
      updateCarouselUI(id, images);
    }

    function updateCarouselUI(id, images) {
      const currentIndex = carouselIndexes[id];
      const imgEl = document.getElementById("carousel-img-" + id);
      
      imgEl.classList.add("opacity-30");
      setTimeout(() => {
        imgEl.src = images[currentIndex];
        imgEl.classList.remove("opacity-30");
      }, 150);

      // Sync Pagination Dots
      const dotsContainer = document.getElementById("carousel-dots-" + id);
      if (dotsContainer) {
        dotsContainer.innerHTML = images.map((img, idx) => `
          <span class="h-1.5 transition-all duration-300 rounded-full ${idx === currentIndex ? 'w-4 bg-white' : 'w-1.5 bg-white/40'}"></span>
        `).join('');
      }
    }

    document.addEventListener("mousedown", (e) => {
      if (e.detail > 1 && e.target.tagName === 'BUTTON') {
        e.preventDefault();
      }
    }, false);

    // --- Interactive Feature: Copy URL link ---
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById("toast");
        const toastText = document.getElementById("toast-text");
        toastText.innerText = "Direct link copied to clipboard!";
        
        toast.classList.remove("opacity-0", "pointer-events-none");
        toast.classList.add("opacity-100");
        
        setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0", "pointer-events-none");
        }, 2000);
      });
    }

    // --- Interactive Feature: Scroll to top ---
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // --- Interactive Feature: Mobile drawer menu toggle ---
    function toggleMobileMenu() {
      const drawer = document.getElementById("mobile-drawer");
      const burger = document.getElementById("burger-icon");
      const close = document.getElementById("close-icon");
      
      if (drawer.classList.contains("h-0")) {
        drawer.className = "lg:hidden absolute top-14 left-0 right-0 overflow-hidden border-b border-zinc-200/50 dark:border-white/5 h-auto transition-all duration-300 bg-white/95 dark:bg-zinc-950/90 backdrop-blur-xl";
        burger.classList.add("hidden");
        close.classList.remove("hidden");
      } else {
        closeMobileMenu();
      }
    }

    // --- Interactive Feature: Mobile drawer menu toggle ---
    function closeMobileMenu() {
      const drawer = document.getElementById("mobile-drawer");
      const burger = document.getElementById("burger-icon");
      const close = document.getElementById("close-icon");
      
      drawer.className = "lg:hidden absolute top-14 left-0 right-0 overflow-hidden border-b border-zinc-200/50 dark:border-white/5 h-0 transition-all duration-300";
      close.classList.add("hidden");
      burger.classList.remove("hidden");
    }
  </script>
    <!-- Global Floating Butterfly Component -->
    <script src="../assets/js/butterfly.js"></script>
</body>
</html>
