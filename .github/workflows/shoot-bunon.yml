name: Screenshot Bunon (one-off)
on:
  push:
    branches: [add-bunon]
    paths: [tools/shoot-bunon.mjs, .github/workflows/shoot-bunon.yml]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/shoot-bunon.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/image/works/bunon-raw
          git commit -m "Add Bunon screenshots" || echo "nothing to commit"
          git push
