name: Fetch shared project images (one-off)
on:
  push:
    branches: [self-host-images]
    paths: [tools/shared-images.txt, .github/workflows/fetch-shared-images.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          set -u
          fail=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            rel="${url#https://ar-tanveer-portfolio.vercel.app/}"
            dest="assets/image/works/shared/${rel// /-}"
            mkdir -p "$(dirname "$dest")"
            if curl -fsSL --retry 3 "${url// /%20}" -o "$dest"; then echo "ok $dest"; else echo "FAILED $url"; fail=$((fail+1)); fi
          done < tools/shared-images.txt
          echo "failures: $fail"
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/image/works/shared
          git commit -m "Add self-hosted copies of shared project images" || echo "nothing to commit"
          git push
